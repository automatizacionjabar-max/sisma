<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, sans-serif; text-align: center; background: #cfd8dc; margin: 0; padding: 15px; }
    .camera-box { width: 100%; max-width: 400px; height: 320px; border-radius: 30px; background: #000; margin: 10px auto; overflow: hidden; position: relative; border: 8px solid #90a4ae; transition: 0.3s; box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #saludo { font-size: 26px; color: #1a237e; margin: 20px 0; min-height: 70px; line-height: 1.3; font-weight: bold; }
    #status-init { font-size: 13px; color: #546e7a; margin-bottom: 5px; text-transform: uppercase; }
    .panel-acciones { display: none; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 440px; margin: auto; }
    button { border: none; color: white; padding: 28px 10px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
    .btn-llegue { background: #1b5e20; grid-column: span 2; font-size: 24px; }
    .btn-salgo { background: #e65100; }
    .btn-vuelvo { background: #01579b; }
    .btn-mevoy { background: #b71c1c; grid-column: span 2; font-size: 24px; }
  </style>
</head>
<body>
  <div id="status-init">⚙️ Iniciando SISMA...</div>
  <div id="saludo">Conectando con el servidor...</div>
  
  <button id="btnDesbloqueo" onclick="iniciarCamara()" style="display:none; width:80%; max-width:400px; margin: 15px auto; background:#01579b; color:white; padding:20px; border-radius:15px; border:none; font-size:18px; font-weight:bold; cursor:pointer;">
    📷 ENCENDER CÁMARA
  </button>

  <div class="camera-box"><video id="video" autoplay muted playsinline></video></div>

  <div id="panel" class="panel-acciones">
    <button class="btn-llegue" onclick="registrar('LLEGUE A TRABAJAR')">☀️ LLEGUE A TRABAJAR</button>
    <button class="btn-salgo" onclick="registrar('SALGO A COMER')">🍴 SALGO A COMER</button>
    <button class="btn-vuelvo" onclick="registrar('VOLVI DE COMER')">↩️ VOLVI DE COMER</button>
    <button class="btn-mevoy" onclick="registrar('ME VOY A CASA')">🏠 ME VOY A CASA</button>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const urlAPI = 'https://script.google.com/macros/s/AKfycbxZ-w7GnW6lIlCgfyZzrA8W5oZI4-Ec9VDN57g7EWOLBRkbrzhImwG2l21QSO9cBAEF/exec';

    let faceMatcher = null;
    let nombresMaestro = {};
    let personaDetectada = null; 
    let nombreDetectado = null;  
    let coords = { lat: null, lon: null };

    async function iniciar() {
      try {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        // Fetch para obtener modelos desde Sheets
        const res = await fetch(urlAPI, { method: 'POST', body: JSON.stringify({ action: 'obtenerModelos' }) });
        const modelos = await res.json();

        const labeledDescriptors = modelos.map(m => {
          nombresMaestro[m.cedula] = m.nombre;
          return new faceapi.LabeledFaceDescriptors(m.cedula, [new Float32Array(m.descriptor)]);
        });

        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
        document.getElementById('status-init').innerText = "SISMA LISTO ✅";
        document.getElementById('saludo').innerHTML = "Toca el botón para empezar.";
        document.getElementById('btnDesbloqueo').style.display = "block";
      } catch (error) {
        document.getElementById('saludo').innerHTML = "❌ Error de conexión con el servidor.";
        console.error(error);
      }
    }

    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = stream;
        document.getElementById('btnDesbloqueo').style.display = "none";
        document.getElementById('saludo').innerHTML = "Por favor, mira a la cámara";

        navigator.geolocation.watchPosition(p => {
          coords.lat = p.coords.latitude; coords.lon = p.coords.longitude;
        }, null, {enableHighAccuracy: true});

        iniciarDeteccion();
      } catch (err) {
        document.getElementById('saludo').innerHTML = "⚠️ Cámara bloqueada. Revisa permisos.";
      }
    }

    function iniciarDeteccion() {
      const video = document.getElementById('video');
      setInterval(async () => {
        if (!faceMatcher) return;
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        if (detection) {
          const match = faceMatcher.findBestMatch(detection.descriptor);
          if (match.label !== 'unknown') {
            personaDetectada = match.label;
            nombreDetectado = nombresMaestro[match.label];
            document.getElementById('saludo').innerHTML = `¡Hola, <b>${nombreDetectado}</b>! 👋`;
            document.getElementById('panel').style.display = "grid";
          }
        }
      }, 700);
    }

    async function registrar(accion) {
      if (!personaDetectada || !coords.lat) return;
      document.getElementById('saludo').innerHTML = "⌛ GUARDANDO...";
      document.getElementById('panel').style.display = "none";

      const res = await fetch(urlAPI, {
        method: 'POST',
        body: JSON.stringify({ cedula: personaDetectada, nombre: nombreDetectado, accion: accion, lat: coords.lat, lon: coords.lon })
      });
      const data = await res.json();
      document.getElementById('saludo').innerHTML = data.message;
      setTimeout(() => { location.reload(); }, 3000);
    }

    iniciar();
  </script>
</body>
</html>
