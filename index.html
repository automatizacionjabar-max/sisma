<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, sans-serif; text-align: center; background: #cfd8dc; margin: 0; padding: 15px; }
    .camera-box { width: 100%; max-width: 400px; aspect-ratio: 4/3; border-radius: 30px; background: #000; margin: 10px auto; overflow: hidden; border: 8px solid #90a4ae; transition: 0.3s; box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #saludo { font-size: 24px; color: #1a237e; margin: 20px 0; min-height: 70px; line-height: 1.3; font-weight: bold; }
    #status-init { font-size: 11px; color: #546e7a; margin-bottom: 5px; text-transform: uppercase; }
    .panel-acciones { display: none; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 440px; margin: auto; animation: fadeInUp 0.4s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    button { border: none; color: white; padding: 25px 10px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
    button:disabled { background: #9e9e9e !important; opacity: 0.6; }
    .btn-llegue { background: #1b5e20; grid-column: span 2; font-size: 22px; }
    .btn-salgo { background: #e65100; }
    .btn-vuelvo { background: #01579b; }
    .btn-mevoy { background: #b71c1c; grid-column: span 2; font-size: 22px; }
    .sisma-logo { font-size: 11px; color: #455a64; margin-top: 25px; font-weight: bold; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="status-init">⚙️ SISMA SIGET-P v1.9</div>
  <div id="saludo">Conectando con Agro Jabar...</div>
  
  <button id="btnDesbloqueo" onclick="iniciarCamara()" style="display:none; width:80%; max-width:400px; margin: 15px auto; background:#01579b; color:white; padding:20px; border-radius:15px; border:none; font-size:18px; font-weight:bold; cursor:pointer;">
    📷 ENCENDER CÁMARA
  </button>

  <div class="camera-box" id="camBox"><video id="video" autoplay muted playsinline></video></div>

  <div id="panel" class="panel-acciones">
    <button class="btn-llegue" onclick="registrar('LLEGUE A TRABAJAR')">☀️ LLEGUE A TRABAJAR</button>
    <button class="btn-salgo" onclick="registrar('SALGO A COMER')">🍴 SALGO A COMER</button>
    <button class="btn-vuelvo" onclick="registrar('VOLVI DE COMER')">↩️ VOLVI DE COMER</button>
    <button class="btn-mevoy" onclick="registrar('ME VOY A CASA')">🏠 ME VOY A CASA</button>
  </div>

  <div class="sisma-logo">SISMA v2 | Agro Jabar SAS - Agroversalles SAS</div>

  <script>
    const urlAPI = 'https://script.google.com/macros/s/AKfycbWv5tOfuxWEhxr6S11dEuyToBDFLjTh17IBVSLic2xQBQikdBxDo0j_mzWMfvbI-G2/exec';
    let faceMatcher = null, nombresMaestro = {}, personaDetectada = null, nombreDetectado = null;
    let coords = { lat: 0, lon: 0 }, enviando = false, watchdogTimer = null;

    async function iniciar() {
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
      try {
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        const res = await fetch(`${urlAPI}?action=obtenerModelos`);
        const modelos = await res.json();
        modelos.forEach(m => nombresMaestro[m.cedula] = m.nombre);
        faceMatcher = new faceapi.FaceMatcher(modelos.map(m => new faceapi.LabeledFaceDescriptors(m.cedula, [new Float32Array(m.descriptor)])), 0.55);
        document.getElementById('saludo').innerText = "Conectado. Pulsa el botón azul.";
        document.getElementById('btnDesbloqueo').style.display = "block";
      } catch (e) { document.getElementById('saludo').innerText = "❌ Error de conexión."; }
    }

    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = stream;
        document.getElementById('btnDesbloqueo').style.display = "none";
        navigator.geolocation.watchPosition(p => { coords.lat = p.coords.latitude; coords.lon = p.coords.longitude; }, null, {enableHighAccuracy: true});
        iniciarDeteccion();
      } catch (e) { alert("Error cámara: " + e.message); }
    }

    function resetearUI() {
      personaDetectada = null; nombreDetectado = null; enviando = false;
      document.getElementById('panel').style.display = "none";
      document.getElementById('saludo').innerHTML = "Por favor, mira a la cámara";
      document.getElementById('camBox').style.borderColor = "#90a4ae";
      document.querySelectorAll('button').forEach(b => b.disabled = false);
      if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
    }

    function iniciarDeteccion() {
      const video = document.getElementById('video');
      setInterval(async () => {
        if (enviando || !faceMatcher) return;

        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        
        if (detection) {
          const match = faceMatcher.findBestMatch(detection.descriptor);
          if (match.label !== 'unknown') {
            // Cancelamos watchdog si hay rostro presente
            if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }

            if (personaDetectada !== match.label) {
              personaDetectada = match.label;
              nombreDetectado = nombresMaestro[match.label];
              document.getElementById('saludo').innerHTML = `¡Hola, <b>${nombreDetectado.split(' ')[0]}</b>! 👋`;
              document.getElementById('panel').style.display = "grid";
              document.getElementById('camBox').style.borderColor = "#1b5e20";
            }
          }
        } else {
          // WATCHDOG DE 10 SEGUNDOS: Si no hay rostro y hay alguien detectado
          if (personaDetectada && !watchdogTimer) {
            watchdogTimer = setTimeout(() => {
              resetearUI();
            }, 10000); // <-- 10 Segundos exactos
          }
        }
      }, 700);
    }

    async function registrar(accion) {
      if (!personaDetectada || enviando) return;
      enviando = true;
      document.querySelectorAll('#panel button').forEach(b => b.disabled = true);
      const saludo = document.getElementById('saludo');
      saludo.innerHTML = "⌛ GUARDANDO REGISTRO...";

      try {
        await fetch(urlAPI, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ cedula: personaDetectada, nombre: nombreDetectado, accion: accion, lat: coords.lat, lon: coords.lon })
        });

        saludo.innerHTML = `✅ ¡Listo ${nombreDetectado.split(' ')[0]}!<br>Registro guardado correctamente.`;
        
        // Espera de 3 segundos antes de volver al modo escaneo
        setTimeout(() => { resetearUI(); }, 3000);

      } catch (error) {
        saludo.innerText = "❌ Error al guardar.";
        enviando = false;
        document.querySelectorAll('#panel button').forEach(b => b.disabled = false);
      }
    }
    iniciar();
  </script>
</body>
</html>
